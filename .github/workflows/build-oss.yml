name: Build WarpOss macOS

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build WarpOss (macOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64-oss-debug

      - name: Install cargo-bundle and create-dmg
        run: |
          script/install_cargo_bundle
          brew install create-dmg

      - name: Build and Bundle WarpOss
        env:
          NO_LICENSES: "1"
        run: |
          script/bundle --channel oss --arch aarch64 --selfsign --debug

      - name: Archive WarpOss.app
        run: |
          APP_PATH=$(find target -name "WarpOss.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: WarpOss.app not found in target/" >&2
            exit 1
          fi
          echo "Found WarpOss.app at $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          zip -r -y "${{ github.workspace }}/WarpOss-macOS-arm64.zip" WarpOss.app

      - name: Upload WarpOss Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpOss-macOS-arm64
          path: WarpOss-macOS-arm64.zip
          retention-days: 14
